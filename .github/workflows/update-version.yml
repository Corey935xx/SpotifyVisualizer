name: Update Version JSON

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Checkout the branch we want to push to (avoid detached HEAD when the workflow is triggered by a tag)
          ref: main

      - id: extract
        name: Extract version code and update version.json
        run: |
          VERSION_CODE=$(echo "${{ github.event.release.tag_name }}" | grep -oE '[0-9]+')
          
          cat <<EOF > version.json
          {
            "latest_version_code": ${VERSION_CODE},
            "download_url": "https://github.com/Corey935xx/SpotifyVisualizer/releases/latest/download/SpotifyVisualizer.apk"
          }
          EOF

          # expose the numeric version for later steps
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: update version.json to version ${{ steps.extract.outputs.version_code }}"
          file_pattern: 'version.json'
          branch: main
