name: Update Version JSON

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update-json:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Explicitly check out the main branch, ignoring the detached release tag
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      # Step 2: Your idea - solely handle extracting the version and editing the file
      - name: Edit version.json
        run: |
          VERSION_CODE=$(echo "${{ github.event.release.tag_name }}" | grep -oE '[0-9]+' | head -n1)
          if [ -z "$VERSION_CODE" ]; then VERSION_CODE="0"; fi
          
          cat > version.json <<EOF
          {
            "latest_version_code": ${VERSION_CODE},
            "download_url": "https://github.com/Corey935xx/SpotifyVisualizer/releases/latest/download/SpotifyVisualizer.apk"
          }
          EOF

      # Step 3: Pass to the dedicated action to handle the commit/push safely
      - name: Commit and Push
        uses: EndBug/add-and-commit@v9
        with:
          author_name: github-actions[bot]
          author_email: github-actions[bot]@users.noreply.github.com
          message: 'auto: update version.json to version ${{ github.event.release.tag_name }}'
          add: 'version.json'
