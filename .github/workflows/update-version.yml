name: Update Version JSON

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: extract
        name: Extract version code and update version.json
        run: |
          VERSION_CODE=$(echo "${{ github.event.release.tag_name }}" | grep -oE '[0-9]+')
          
          cat <<EOF > version.json
          {
            "latest_version_code": ${VERSION_CODE},
            "download_url": "https://github.com/Corey935xx/SpotifyVisualizer/releases/latest/download/SpotifyVisualizer.apk"
          }
          EOF

          # expose the numeric version for later steps
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push changes
        run: |
          git checkout main
          git add version.json
          git commit -m "auto: update version.json to version ${{ steps.extract.outputs.version_code }}" || exit 0
          git push origin main
