name: Update Version JSON

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update-json:
    runs-on: ubuntu-latest
    steps:
      # Proven Fix: Force Git to attach directly to the 'main' branch
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update version and push
        run: |
          # 1. Grab tag and extract number safely (fallback to 0 if it fails to read)
          TAG="${{ github.event.release.tag_name }}"
          VERSION_CODE=$(echo "$TAG" | grep -oE '[0-9]+' | head -n1)
          if [ -z "$VERSION_CODE" ]; then VERSION_CODE="0"; fi
          
          # 2. Overwrite the JSON file
          cat > version.json <<EOF
          {
            "latest_version_code": ${VERSION_CODE},
            "download_url": "https://github.com/Corey935xx/SpotifyVisualizer/releases/latest/download/SpotifyVisualizer.apk"
          }
          EOF
          
          # 3. Configure Git authentication
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 4. Commit and Push normally (now that we are safely on 'main')
          git add version.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "auto: update version.json to version ${VERSION_CODE}"
            git push origin main
          fi
