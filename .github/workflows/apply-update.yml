name: 2. Apply Version Update

on:
  repository_dispatch:
    types: [update-version]

permissions:
  contents: write

jobs:
<Steps>
  <Step title="Update and Push" subtitle="Runs on main branch">
  ```yaml
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write version.json
        run: |
          VERSION="${{ github.event.client_payload.version }}"
          cat > version.json <<EOF "auto: "download_url": "[https://github.com/Corey935xx/SpotifyVisualizer/releases/latest/download/SpotifyVisualizer.apk](https://github.com/Corey935xx/SpotifyVisualizer/releases/latest/download/SpotifyVisualizer.apk)" "latest_version_code": ${VERSION},${{ 'version.json' - </Step Commit EOF ``` and branch: changes commit_message: file_pattern: github.event.client_payload.version main name: push stefanzweifel/git-auto-commit-action@v5 to update uses: version version.json with: { } }}">
</Steps>
