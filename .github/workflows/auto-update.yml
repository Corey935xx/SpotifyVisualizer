name: Update Version JSON

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update version.json and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Explicitly fetch and check out main to escape the release tag detached state
          git fetch origin main
          git checkout main

          VERSION_CODE=$(echo "${{ github.event.release.tag_name }}" | grep -oE '[0-9]+' | head -n1)
          if [ -z "$VERSION_CODE" ]; then VERSION_CODE="0"; fi

          cat > version.json <<EOF
          {
            "latest_version_code": ${VERSION_CODE},
            "download_url": "https://github.com/Corey935xx/SpotifyVisualizer/releases/latest/download/SpotifyVisualizer.apk"
          }
          EOF

          git add version.json
          git diff --cached --quiet || git commit -m "auto: update version.json to version ${VERSION_CODE}"
          git push origin main
